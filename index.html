<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>迷你賽車：手機即玩（左右按鈕版）</title>
<style>
:root{
  --bg:#0b1220; --txt:#fff; --accent:#38b6ff;
  --panel:rgba(255,255,255,.12);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
  overflow:hidden; touch-action:none;
}
#wrap{position:relative;width:100vw;height:100vh}
canvas{width:100%;height:100%;display:block}

/* BIG SIDE BUTTONS */
.sideBtn{
  position:absolute; top:0; bottom:0; width:22vw; max-width:160px;
  display:flex; align-items:center; justify-content:center;
  font-size:44px; font-weight:900;
  background:linear-gradient(to bottom, rgba(255,255,255,.10), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.18);
  color:#fff;
  user-select:none; -webkit-user-select:none;
}
.sideBtn:active{background:rgba(255,255,255,.22)}
#leftBtn{left:0;border-radius:0 18px 18px 0}
#rightBtn{right:0;border-radius:18px 0 0 18px}

/* HUD */
.hud{
  position:absolute; left:12px; top:12px; right:12px;
  display:flex; justify-content:space-between; gap:8px; pointer-events:none;
}
.chip{
  background:var(--panel); border-radius:14px; padding:8px 12px;
  min-width:96px; text-align:center; font-weight:800;
}
.centerTop{
  position:absolute; top:12px; left:50%; transform:translateX(-50%);
}
.btn{
  background:var(--panel); border:1px solid rgba(255,255,255,.2);
  color:#fff; padding:8px 12px; border-radius:12px; font-weight:700;
}
.overlay{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,.6)
}
.card{
  background:rgba(255,255,255,.1); border-radius:18px;
  padding:18px; text-align:center; width:min(92vw,420px)
}
.primary{background:var(--accent); color:#001018; border:0; padding:12px 18px; border-radius:14px; font-weight:900}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div class="hud">
    <div class="chip">速度 <span id="spd">0</span></div>
    <div class="chip">分數 <span id="score">0</span></div>
    <div class="chip">最佳 <span id="best">0</span></div>
  </div>

  <div class="centerTop">
    <button class="btn" id="pauseBtn">暫停</button>
  </div>

  <!-- BIG LEFT / RIGHT BUTTONS -->
  <div class="sideBtn" id="leftBtn">◀</div>
  <div class="sideBtn" id="rightBtn">▶</div>

  <div class="overlay" id="overlay">
    <div class="card">
      <h2>🏁 迷你賽車</h2>
      <p>按左右螢幕邊緣轉向<br>一直撐下去就得高分</p>
      <button class="primary" id="startBtn">開始</button>
    </div>
  </div>
</div>

<script>
(()=>{
  const c=document.getElementById('c'),ctx=c.getContext('2d');
  let W,H,DPR;
  function resize(){
    DPR=Math.min(2.5,devicePixelRatio||1);
    W=innerWidth*DPR; H=innerHeight*DPR;
    c.width=W; c.height=H;
  } addEventListener('resize',resize); resize();

  const spdEl=spd=document.getElementById('spd'),
        scoreEl=document.getElementById('score'),
        bestEl=document.getElementById('best');
  let best=Number(localStorage.getItem('racer_best')||0); bestEl.textContent=best;

  let x=W/2, y=H*0.75, speed=400*DPR, score=0;
  let running=false, paused=false;
  const obs=[];

  function spawn(){ obs.push({x:(Math.random()*.6+.2)*W, y:-40*DPR}); }

  const input={L:false,R:false};
  function bind(btn,key){
    btn.addEventListener('touchstart',e=>{e.preventDefault();input[key]=true},{passive:false});
    btn.addEventListener('touchend',e=>{e.preventDefault();input[key]=false},{passive:false});
  }
  bind(leftBtn,'L'); bind(rightBtn,'R');

  function loop(){
    if(running&&!paused){
      if(Math.random()<0.03) spawn();
      if(input.L) x-=10*DPR;
      if(input.R) x+=10*DPR;
      x=Math.max(40*DPR,Math.min(W-40*DPR,x));
      speed+=.2*DPR;
      score+=1; scoreEl.textContent=score;
      spdEl.textContent=Math.round(speed/(DPR*6));
      ctx.fillStyle='#0b1220'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#38b6ff'; ctx.fillRect(x-20*DPR,y-40*DPR,40*DPR,80*DPR);
      ctx.fillStyle='#ff4d4d';
      for(let i=obs.length-1;i>=0;i--){
        obs[i].y+=speed*.02;
        ctx.fillRect(obs[i].x-18*DPR,obs[i].y-18*DPR,36*DPR,36*DPR);
        if(obs[i].y>H) obs.splice(i,1);
        if(Math.abs(obs[i].x-x)<30*DPR && Math.abs(obs[i].y-y)<40*DPR){
          running=false;
          if(score>best){best=score;localStorage.setItem('racer_best',best)}
          overlay.style.display='flex';
        }
      }
    }
    requestAnimationFrame(loop);
  } loop();

  startBtn.onclick=()=>{
    overlay.style.display='none';
    obs.length=0; speed=400*DPR; score=0;
    running=true; paused=false;
  };
  pauseBtn.onclick=()=>paused=!paused;
})();
</script>
</body>
</html>
