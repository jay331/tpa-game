<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10秒點擊挑戰</title>
  <style>
    :root { --bg:#0f172a; --card:#1e2a38; --btn:#38b6ff; --btn2:#60a5ff; --txt:#ffffff; }
    *{ box-sizing:border-box; }
    body{
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
      background:var(--bg); color:var(--txt);
    }
    .card{
      width:min(520px, 92vw);
      background:var(--card);
      border-radius:16px;
      padding:22px 18px;
      box-shadow:0 0 24px rgba(0,0,0,.45);
      text-align:center;
    }
    h1{ font-size:22px; margin:0 0 12px; }
    .row{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:12px 0 6px; }
    .stat{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      border-radius:12px;
      padding:10px 12px;
      min-width:140px;
    }
    .label{ opacity:.8; font-size:12px; margin-bottom:4px; }
    .value{ font-size:22px; font-weight:700; letter-spacing:.5px; }
    button{
      appearance:none; border:0; border-radius:12px;
      padding:14px 20px; font-size:18px; font-weight:700;
      background:var(--btn); color:#001018;
      cursor:pointer;
      transition: transform .06s ease, filter .12s ease;
      width:min(320px, 80vw);
      touch-action:manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover{ filter:brightness(1.05); }
    button:active{ transform:scale(.985); background:var(--btn2); }
    .hint{ margin-top:10px; font-size:13px; opacity:.85; line-height:1.45; }
    .small{ margin-top:8px; font-size:12px; opacity:.65; }
    .footer{
      margin-top:14px; display:flex; justify-content:center; gap:10px; flex-wrap:wrap;
    }
    .ghost{
      background:transparent; color:var(--txt);
      border:1px solid rgba(255,255,255,.18);
      font-weight:600;
      width:auto;
      padding:10px 14px;
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>🎮 10 秒點擊挑戰</h1>

    <div class="row" aria-live="polite">
      <div class="stat">
        <div class="label">得分</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="stat">
        <div class="label">剩餘時間</div>
        <div class="value" id="time">10</div>
      </div>
      <div class="stat">
        <div class="label">最佳紀錄（本機）</div>
        <div class="value" id="best">0</div>
      </div>
    </div>

    <button id="tapBtn">點我得分</button>

    <div class="footer">
      <button class="ghost" id="resetBestBtn">清除最佳紀錄</button>
      <button class="ghost" id="restartBtn">重新開始</button>
    </div>

    <p class="hint">按下「點我得分」會自動開始倒數。10 秒內點越多越好！</p>
    <p class="small">離線可玩；最佳紀錄會存在你的裝置（localStorage）。</p>
  </main>

<script>
(() => {
  const scoreEl = document.getElementById('score');
  const timeEl  = document.getElementById('time');
  const bestEl  = document.getElementById('best');
  const btn     = document.getElementById('tapBtn');
  const restartBtn = document.getElementById('restartBtn');
  const resetBestBtn = document.getElementById('resetBestBtn');

  const BEST_KEY = 'tap_game_best_v1';
  let best = Number(localStorage.getItem(BEST_KEY) || 0);
  bestEl.textContent = best;

  let score = 0;
  let time  = 10;
  let timer = null;
  let running = false;

  function render(){
    scoreEl.textContent = score;
    timeEl.textContent  = time;
    bestEl.textContent  = best;
  }

  function endGame(){
    running = false;
    btn.disabled = true;
    btn.textContent = '時間到！再玩一次';
    if (score > best){
      best = score;
      localStorage.setItem(BEST_KEY, String(best));
      render();
    }
    // iOS 上 alert 偶爾會卡住觸控，改用 confirm 更穩
    setTimeout(() => {
      const again = confirm(`時間到！\n你的分數：${score}\n最佳紀錄：${best}\n\n要再玩一次嗎？`);
      if (again) startNewGame();
    }, 50);
  }

  function tick(){
    time -= 1;
    render();
    if (time <= 0){
      clearInterval(timer);
      timer = null;
      endGame();
    }
  }

  function startNewGame(){
    if (timer) { clearInterval(timer); timer = null; }
    score = 0;
    time  = 10;
    running = false;
    btn.disabled = false;
    btn.textContent = '點我得分';
    render();
  }

  function start(){
    if (running) return;
    running = true;
    timer = setInterval(tick, 1000);
  }

  function hit(){
    if (time <= 0) return;
    if (!running) start();
    score += 1;
    render();
  }

  // Events
  btn.addEventListener('click', hit);
  // iOS 觸控加強（避免 300ms 延遲/誤判）
  btn.addEventListener('touchend', (e) => { e.preventDefault(); hit(); }, {passive:false});

  restartBtn.addEventListener('click', startNewGame);
  resetBestBtn.addEventListener('click', () => {
    best = 0;
    localStorage.removeItem(BEST_KEY);
    render();
    alert('已清除最佳紀錄');
  });

  // init
  startNewGame();
})();
</script>
</body>
</html>
